<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謎解き探偵ゲーム — 事件簿</title>
<meta name="description" content="孤島の洋館から始まる、なりきり謎解き探偵ゲーム。手がかりを集め、推理し、事件を解決せよ。">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12141c">
<meta name="background-color" content="#0b0c12">

<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="事件簿">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#12141c;
    --void-deep:#0b0c12;
    --panel:#1b1e29;
    --panel-light:#232735;
    --paper:#ece4d2;
    --paper-dark:#dcd2b8;
    --ink:#e9e3d2;
    --ink-dim:#9aa0b4;
    --ink-faint:#6b7080;
    --crimson:#8f2a35;
    --crimson-bright:#b8394a;
    --gold:#b9924f;
    --gold-soft:#8a7143;
    --line:#33384a;
    --shadow-deep: 0 20px 60px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 700px at 50% -10%, #1c2030 0%, var(--void) 45%, var(--void-deep) 100%);
    color:var(--ink);
    font-family:'Noto Serif JP', serif;
    min-height:100vh;
    line-height:1.8;
    overflow-x:hidden;
  }
  .display{ font-family:'Shippori Mincho', serif; }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 2px);
    pointer-events:none;
    z-index:0;
  }

  .app{
    position:relative;
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 120px;
    z-index:1;
  }

  /* ===== Header ===== */
  header.top{
    padding:44px 0 28px;
    text-align:center;
    border-bottom:1px solid var(--line);
    margin-bottom:32px;
    position:relative;
  }
  .eyebrow{
    letter-spacing:.5em;
    font-size:11px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1.title{
    font-size:clamp(26px,4.6vw,42px);
    font-weight:800;
    margin:0 0 8px;
    letter-spacing:.06em;
    color:var(--ink);
    text-shadow:0 2px 24px rgba(184,57,74,0.25);
  }
  .subtitle{
    color:var(--ink-dim);
    font-size:14px;
    letter-spacing:.15em;
  }
  .ep-crumb{
    margin-top:10px; font-size:11px; color:var(--ink-faint); letter-spacing:.08em;
    cursor:pointer; display:inline-block;
  }
  .ep-crumb:hover{ color:var(--gold); }
  .install-btn{ display:block; margin:16px auto 0; padding:9px 22px; font-size:12px; letter-spacing:.1em; }

  .phase-rail{
    display:flex; justify-content:center; gap:0; margin-top:26px;
    font-size:12px; letter-spacing:.1em; color:var(--ink-faint);
  }
  .phase-rail .p{ padding:6px 18px; position:relative; }
  .phase-rail .p:not(:last-child)::after{
    content:"—"; position:absolute; right:-6px; color:var(--line);
  }
  .phase-rail .p.active{ color:var(--gold); font-weight:700; }
  .phase-rail .p.done{ color:var(--ink-dim); }

  .screen{ display:none; animation:fadeIn .5s ease; }
  .screen.visible{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ===== Episode select ===== */
  .case-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px; margin:36px 0;
  }
  .case-card{
    background:var(--panel); border:1px solid var(--line); border-radius:2px;
    padding:26px 24px; position:relative; overflow:hidden; cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .case-card:hover{ border-color:var(--gold-soft); transform:translateY(-2px); }
  .case-card.locked{ cursor:default; opacity:.5; }
  .case-card.locked:hover{ transform:none; border-color:var(--line); }
  .case-num{ font-size:11px; letter-spacing:.2em; color:var(--gold); margin-bottom:10px; }
  .case-title{ font-family:'Shippori Mincho',serif; font-size:21px; color:var(--paper); margin-bottom:6px; }
  .case-sub{ font-size:12px; color:var(--ink-faint); margin-bottom:14px; letter-spacing:.08em; }
  .case-teaser{ font-size:13px; color:var(--ink-dim); margin-bottom:16px; }
  .case-status{
    font-size:11px; letter-spacing:.1em; display:inline-block;
    padding:4px 10px; border-radius:20px; border:1px solid var(--gold-soft); color:var(--gold);
  }
  .case-status.cleared{ border-color:#6a8f6f; color:#8fb894; }
  .case-status.locked{ border-color:var(--line); color:var(--ink-faint); }

  /* ===== Prologue ===== */
  .prologue{ max-width:720px; margin:40px auto; text-align:left; }
  .prologue p{ margin:0 0 20px; color:var(--ink); font-size:16px; }
  .prologue .lede{
    font-family:'Shippori Mincho',serif;
    font-size:20px; color:var(--paper);
    border-left:3px solid var(--crimson);
    padding-left:18px; margin-bottom:28px;
  }
  .cast-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px; margin:28px 0 36px;
  }
  .cast-card{
    background:var(--panel); border:1px solid var(--line); border-radius:2px;
    padding:14px 12px; text-align:center;
  }
  .cast-card .role{ font-size:11px; color:var(--gold); letter-spacing:.1em; }
  .cast-card .name{ font-family:'Shippori Mincho',serif; font-size:16px; margin-top:4px; }

  .hint-select{
    max-width:520px; margin:32px auto 0; border:1px solid var(--line); border-radius:2px;
    background:var(--panel); padding:18px 20px;
  }
  .hint-select .hs-label{ font-size:11px; letter-spacing:.12em; color:var(--gold); margin-bottom:10px; }
  .hint-option{
    display:flex; align-items:flex-start; gap:10px; padding:11px 12px; margin-bottom:6px;
    border:1px solid var(--line); border-radius:2px; cursor:pointer; transition:all .15s ease;
  }
  .hint-option:last-child{ margin-bottom:0; }
  .hint-option:hover{ border-color:var(--gold-soft); }
  .hint-option.active{ border-color:var(--gold); background:rgba(185,146,79,0.08); }
  .hint-option input{ margin-top:3px; accent-color:var(--crimson); }
  .hint-option .ho-title{ font-size:13.5px; color:var(--paper); font-family:'Shippori Mincho',serif; }
  .hint-option .ho-desc{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  .cta-row{ text-align:center; margin-top:40px; }
  button.btn{
    font-family:'Shippori Mincho',serif;
    background:var(--crimson);
    color:#f4ece1;
    border:1px solid var(--crimson-bright);
    padding:14px 38px;
    font-size:15px;
    letter-spacing:.15em;
    cursor:pointer;
    border-radius:2px;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 24px rgba(143,42,53,0.3);
  }
  button.btn:hover{ background:var(--crimson-bright); transform:translateY(-1px); }
  button.btn:active{ transform:translateY(0px); }
  button.btn.ghost{
    background:transparent; color:var(--gold); border:1px solid var(--gold-soft);
    box-shadow:none;
  }
  button.btn.ghost:hover{ background:rgba(185,146,79,0.1); }
  button.btn:disabled{ opacity:.35; cursor:not-allowed; transform:none; }

  /* ===== Investigation layout ===== */
  .investigate-layout{
    display:grid; grid-template-columns: 1fr 300px; gap:28px; align-items:start;
  }
  @media (max-width:880px){ .investigate-layout{ grid-template-columns:1fr; } }

  .loc-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .loc-tab{
    font-size:12px; letter-spacing:.08em; color:var(--ink-dim);
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:2px; cursor:pointer;
    transition:all .15s ease;
  }
  .loc-tab.active{ color:var(--gold); border-color:var(--gold-soft); background:var(--panel-light); }
  .loc-tab .count{ color:var(--ink-faint); font-size:10px; margin-left:4px; }

  .clue-list{ display:flex; flex-direction:column; gap:12px; }
  .clue-card{ background:var(--panel); border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .clue-card.locked-out{ opacity:.4; }
  .clue-card.locked-out .clue-head{ cursor:not-allowed; }
  .clue-card.locked-out .clue-head:hover{ background:none; }
  .clue-card.locked-out .clue-mark{ color:var(--crimson-bright); border-color:var(--crimson); }
  .clue-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 18px; cursor:pointer; user-select:none; }
  .clue-head:hover{ background:var(--panel-light); }
  .clue-title{ font-family:'Shippori Mincho',serif; font-size:16px; color:var(--paper); }
  .clue-sub{ font-size:11px; color:var(--ink-faint); margin-top:3px; letter-spacing:.05em; }
  .clue-mark{ font-size:11px; color:var(--gold); border:1px solid var(--gold-soft); padding:3px 9px; border-radius:20px; white-space:nowrap; margin-left:12px; }
  .clue-mark.unread{ color:var(--ink-faint); border-color:var(--line); }
  .clue-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; border-top:1px solid var(--line); }
  .clue-body.open{ max-height:1200px; }
  .clue-body-inner{ padding:18px 20px 22px; }
  .clue-body-inner p{ margin:0 0 14px; color:var(--ink); font-size:14.5px; }
  .clue-body-inner p:last-child{ margin-bottom:0; }
  .quote{ border-left:2px solid var(--gold-soft); padding:10px 16px; margin:14px 0; background:rgba(185,146,79,0.06); color:var(--paper); font-size:14px; }
  .evidence-tag{ display:inline-block; margin-top:6px; margin-right:6px; font-size:11px; color:var(--void); background:var(--gold); padding:3px 10px; border-radius:2px; letter-spacing:.05em; }

  .notebook{
    background:var(--paper); color:#2a2418; border-radius:2px;
    padding:22px 20px; position:sticky; top:20px;
    box-shadow:var(--shadow-deep);
    border:1px solid var(--paper-dark);
  }
  .notebook h3{ font-family:'Shippori Mincho',serif; margin:0 0 4px; font-size:17px; border-bottom:2px solid #2a2418; padding-bottom:10px; }
  .notebook .nb-sub{ font-size:11px; color:#6b6148; margin-bottom:14px; letter-spacing:.06em;}
  .nb-item{ font-size:12.5px; padding:9px 0; border-bottom:1px dashed #c9bc98; display:flex; gap:8px; }
  .nb-item:last-child{ border-bottom:none; }
  .nb-item .dot{ color:var(--crimson); flex-shrink:0; }
  .nb-empty{ font-size:12px; color:#8a7f60; font-style:italic; }
  .nb-progress{ margin-top:16px; font-size:11px; color:#6b6148; text-align:right; transition:color .15s ease; }
  .nb-progress.budget-flash{ color:var(--crimson); font-weight:700; }
  @keyframes flashWarn{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .budget-flash{ animation:flashWarn .35s ease 2; }

  .stepper-row{ display:flex; justify-content:space-between; margin-top:32px; }

  /* ===== Deduction ===== */
  .deduction-wrap{ max-width:760px; margin:0 auto; }
  .q-block{ background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:26px 26px 22px; margin-bottom:22px; }
  .q-num{ font-size:11px; color:var(--gold); letter-spacing:.15em; margin-bottom:8px;}
  .q-text{ font-family:'Shippori Mincho',serif; font-size:19px; color:var(--paper); margin-bottom:18px; }
  .opt{ display:flex; align-items:flex-start; gap:12px; padding:13px 16px; margin-bottom:8px; border:1px solid var(--line); border-radius:2px; cursor:pointer; transition:all .15s ease; }
  .opt:hover{ border-color:var(--gold-soft); background:var(--panel-light); }
  .opt.selected{ border-color:var(--gold); background:rgba(185,146,79,0.1); }
  .opt input{ margin-top:3px; accent-color:var(--crimson); }
  .opt-label{ font-size:14px; color:var(--ink); }

  /* ===== Confrontation ===== */
  .confront-wrap{ max-width:720px; margin:0 auto; }
  .confront-setup{ font-size:14.5px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:20px 22px; margin-bottom:22px; }
  .confront-entry{ margin-bottom:16px; }
  .confront-bubble{ max-width:90%; padding:13px 16px; border-radius:2px; font-size:14px; line-height:1.7; margin-bottom:8px; position:relative; }
  .confront-bubble .cb-name{ display:block; font-size:10.5px; letter-spacing:.1em; color:var(--ink-faint); margin-bottom:4px; }
  .confront-bubble.culprit{ background:rgba(143,42,53,0.12); border:1px solid var(--crimson); color:var(--paper); margin-right:auto; }
  .confront-bubble.culprit .cb-name{ color:var(--crimson-bright); }
  .confront-bubble.detective{ background:rgba(185,146,79,0.1); border:1px solid var(--gold-soft); color:var(--paper); margin-left:auto; text-align:right; }
  .confront-bubble.detective .cb-name{ color:var(--gold); }
  .confront-round{ margin-top:6px; }
  .confront-round-num{ text-align:center; font-size:11px; letter-spacing:.15em; color:var(--gold); margin-bottom:14px; }
  .confront-prompt{ text-align:center; font-size:13px; color:var(--ink-dim); margin:18px 0 12px; }
  .eopt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:600px){ .eopt-grid{ grid-template-columns:1fr; } }
  .eopt{
    background:var(--panel); border:1px solid var(--line); border-radius:2px;
    padding:16px 16px; cursor:pointer; transition:all .15s ease; text-align:center;
  }
  .eopt:hover{ border-color:var(--gold); background:var(--panel-light); transform:translateY(-1px); }
  .eopt-label{ font-size:13.5px; color:var(--ink); }
  .confront-hit{ text-align:center; background:var(--panel); border:1px solid var(--gold-soft); border-radius:2px; padding:22px; margin-top:10px; }
  .confront-hit p{ color:var(--paper); font-size:14.5px; margin:0 0 16px; }
  .confront-gameover{ text-align:center; background:rgba(143,42,53,0.1); border:1px solid var(--crimson); border-radius:2px; padding:30px 26px; margin-top:14px; }
  .go-title{ font-size:24px; color:var(--crimson-bright); letter-spacing:.1em; margin-bottom:14px; }
  .confront-gameover p{ color:var(--ink); font-size:14.5px; margin-bottom:20px; }
  .confront-confession{ background:var(--panel); border:1px solid var(--gold); border-radius:2px; padding:28px 26px; margin-top:14px; }
  .cf-title{ font-size:22px; color:var(--gold); letter-spacing:.1em; margin-bottom:16px; text-align:center; }
  .confront-confession p{ color:var(--ink); font-size:14.5px; margin:0 0 14px; }

  /* ===== Result ===== */
  .result-banner{ text-align:center; padding:34px 20px 24px; margin-bottom:8px; }
  .result-banner .verdict{ font-family:'Shippori Mincho',serif; font-size:30px; font-weight:800; letter-spacing:.08em; }
  .result-banner.correct .verdict{ color:#c7a95f; }
  .result-banner.wrong .verdict{ color:var(--ink-dim); }
  .result-banner .sub{ color:var(--ink-dim); font-size:13px; margin-top:8px; letter-spacing:.08em; }

  .solution-section{ background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:28px 30px; margin-bottom:20px; }
  .solution-section h2{ font-family:'Shippori Mincho',serif; font-size:20px; color:var(--paper); margin:0 0 6px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .solution-section h2 .num{ color:var(--crimson-bright); margin-right:8px; }
  .solution-section p{ font-size:14.5px; color:var(--ink); margin:14px 0; }

  table.evidence-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  table.evidence-table th, table.evidence-table td{ border:1px solid var(--line); padding:10px 12px; text-align:left; color:var(--ink); }
  table.evidence-table th{ background:var(--panel-light); color:var(--gold); font-weight:500; letter-spacing:.05em; }

  .epilogue-block .char{ margin-bottom:16px; }
  .epilogue-block .char .who{ color:var(--gold); font-size:12px; letter-spacing:.1em; margin-bottom:4px; }

  .toggle-alt{ text-align:center; margin:30px 0; }
  .alt-route{ display:none; background:linear-gradient(180deg, rgba(143,42,53,0.08), transparent); border:1px solid var(--crimson); border-radius:2px; padding:28px 30px; margin-top:10px; }
  .alt-route.visible{ display:block; animation:fadeIn .5s ease; }
  .alt-route h2{ color:var(--crimson-bright); font-family:'Shippori Mincho',serif; margin-top:0;}

  footer.end{ text-align:center; margin-top:50px; color:var(--ink-faint); font-size:12px; letter-spacing:.1em; }

  ::selection{ background:var(--crimson); color:#fff; }

  @media(max-width:600px){
    .app{ padding:0 14px 100px; }
    .solution-section, .q-block{ padding:20px 18px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="eyebrow">MURDER MYSTERY · 推理探偵ゲーム</div>
    <h1 class="title display" id="headerTitle">事件簿</h1>
    <div class="subtitle" id="headerSubtitle">EPISODE ARCHIVE</div>
    <div class="ep-crumb" id="epCrumb" style="display:none;" onclick="goSelect()">← 事件一覧に戻る</div>
    <button id="installBtn" class="btn ghost install-btn" style="display:none;">📥 アプリをインストール</button>
    <div class="phase-rail" id="phaseRail" style="display:none;">
      <div class="p" data-phase="0">序章</div>
      <div class="p" data-phase="1">捜査</div>
      <div class="p" data-phase="2">推理</div>
      <div class="p" data-phase="3">対決</div>
      <div class="p" data-phase="4">解決</div>
    </div>
  </header>

  <!-- ===================== SCREEN: EPISODE SELECT ===================== -->
  <section class="screen visible" id="screen-select">
    <p style="text-align:center; color:var(--ink-dim); font-size:14px; max-width:560px; margin:0 auto;">
      解決した事件、まだ見ぬ事件——探偵の元に届いた依頼の記録。挑む事件を選んでください。
    </p>
    <div class="case-grid" id="caseGrid"></div>
  </section>

  <!-- ===================== SCREEN 0: PROLOGUE ===================== -->
  <section class="screen" id="screen-0">
    <div class="prologue" id="prologueContent"></div>
  </section>

  <!-- ===================== SCREEN 1: INVESTIGATION ===================== -->
  <section class="screen" id="screen-1">
    <div class="investigate-layout">
      <div>
        <div class="loc-tabs" id="locTabs"></div>
        <div class="clue-list" id="clueList"></div>
        <div class="stepper-row">
          <button class="btn ghost" onclick="goPhase(0)">← 序章に戻る</button>
          <button class="btn" id="toDeductionBtn" onclick="goPhase(2)" disabled>推理へ進む →</button>
        </div>
      </div>
      <div class="notebook">
        <h3 class="display">捜査ノート</h3>
        <div class="nb-sub">収集した証拠</div>
        <div id="nbList"><div class="nb-empty">まだ証拠はありません。カードを開いて調べましょう。</div></div>
        <div class="nb-progress" id="nbProgress">0 / 0 件の手がかりを確認</div>
      </div>
    </div>
  </section>

  <!-- ===================== SCREEN 2: DEDUCTION ===================== -->
  <section class="screen" id="screen-2">
    <div class="deduction-wrap" id="deductionContent"></div>
  </section>

  <!-- ===================== SCREEN 3: CONFRONTATION ===================== -->
  <section class="screen" id="screen-3">
    <div class="confront-wrap" id="confrontContent"></div>
  </section>

  <!-- ===================== SCREEN 4: RESULT / SOLUTION ===================== -->
  <section class="screen" id="screen-4">
    <div id="resultBanner" class="result-banner"></div>
    <div id="resultBody"></div>
  </section>

</div>

<script>
/* ========================================================================
   HOW TO ADD A NEW EPISODE
   ------------------------------------------------------------------------
   1. Copy the "episode1" object below as a template.
   2. Give it a unique `id`, the next `number`, a `title`/`subtitle`/`teaser`.
   3. Set `status` to "available" (or "locked" to show a "coming soon" card).
   4. Fill `locations` (tabs) and `clues` (investigation cards). Each clue's
      `evidence` array feeds the notebook sidebar automatically.
   5. Give each `cast` member a unique `id` — these double as the Question 1
      suspect checklist (multi-select: 1 id for a solo culprit, 2+ for a
      conspiracy). Fill `questions.q2/q3` (single-choice) and `correct`
      (`correct.q1` is an array of cast ids; `correct.q2`/`q3` are option ids).
   6. Fill `solutionSections`, `evidenceTable`, `epilogue`, and optionally

      "同じ証拠を読み直すと——懐剣を最後にセットしたのは悠人であり、倉庫の管理者でもある。トリカブトの持ち出しにおいて、最も自然にアクセスできたのは彼だったとも言える。",
      "<strong>見落とされていた可能性：</strong>『父の再婚を受け入れていた』という悠人の証言は、本心を隠すための演技だったとしたら。舞台美術の仕事を『二流』と評され続けた鬱屈は、九鬼のそれと同じくらい根深いものだったかもしれない。",
      "<strong>犯行の実像：</strong>悠人はカップの運搬こそしていないが、倉庫からトリカブトを持ち出し、あらかじめ何らかの形で天城の手元に渡るよう仕組んだ——九鬼が『俺が運ぶ』と申し出たのは、単なる偶然に過ぎなかった、という筋書きも成立してしまう。",
    ],
    note:"※ 九鬼の指紋・アリバイの矛盾・企画書という物証の積み重ねに対し、この説は状況証拠だけで物的証拠を欠きます。今回の正解ルートは『演出家・九鬼の単独犯行』でした。"
  },
  redHerrings: [
    "消えたお守り：天城が指輪に交換するため、自身で保管していただけだった。",
    "懐剣のすり替え：天城本人が業者に内密で発注したもので、事件性はなかった。",
    "遠山の経営権相談と過去の不正：殺人事件とは別に隠されていた、劇場内のもう一つの秘密だった。",
    "柚木との脚本を巡る対立：感情的な軋轢はあったが、事件そのものとは無関係だった。",
  ]
};

const episodes = [ episode1, episode2, episode3 ];

/* ========================================================================
   STATE
   ======================================================================== */
let currentEpisode = null;
let currentLoc = null;
let openedClues = new Set();
let collectedEvidence = [];
let selected = { q1:[], q2:null, q3:null };
let clearedEpisodes = new Set();
let hintLevel = "standard"; // "standard" | "hard"
let cluesUsed = 0;
let confrontRound = 0;
let confrontStage = "question"; // "question" | "hit" | "gameover" | "confession"
let confrontLog = [];

/* ========================================================================
   EPISODE SELECT SCREEN
   ======================================================================== */
function renderCaseGrid(){
  const grid = document.getElementById("caseGrid");
  grid.innerHTML = "";
  episodes.forEach(ep=>{
    const locked = ep.status === "locked";
    const cleared = clearedEpisodes.has(ep.id);
    const card = document.createElement("div");
    card.className = "case-card" + (locked ? " locked":"");
    card.innerHTML = `
      <div class="case-num">FILE No.${String(ep.number).padStart(2,"0")}</div>
      <div class="case-title display">${ep.title}</div>
      <div class="case-sub">${ep.subtitle}</div>
      <div class="case-teaser">${ep.teaser}</div>
      <div class="case-status ${locked?'locked':(cleared?'cleared':'')}">${locked ? "近日公開" : (cleared ? "解決済み" : "捜査可能")}</div>
    `;
    if(!locked){ card.onclick = ()=> loadEpisode(ep); }
    grid.appendChild(card);
  });
}

function goSelect(){
  currentEpisode = null;
  document.getElementById("epCrumb").style.display = "none";
  document.getElementById("phaseRail").style.display = "none";
  document.getElementById("headerTitle").textContent = "事件簿";
  document.getElementById("headerSubtitle").textContent = "EPISODE ARCHIVE";
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("visible"));
  document.getElementById("screen-select").classList.add("visible");
  renderCaseGrid();
  window.scrollTo({top:0, behavior:"smooth"});
}

function loadEpisode(ep){
  currentEpisode = ep;
  openedClues = new Set();
  collectedEvidence = [];
  selected = { q1:[], q2:null, q3:null };
  hintLevel = "standard";
  cluesUsed = 0;
  confrontRound = 0;
  confrontStage = "question";
  confrontLog = [];
  currentLoc = ep.locations[0].id;

  document.getElementById("epCrumb").style.display = "inline-block";
  document.getElementById("phaseRail").style.display = "flex";
  document.getElementById("headerTitle").textContent = ep.title;
  document.getElementById("headerSubtitle").textContent = ep.subtitle;

  renderPrologue();
  goPhase(0);
}

/* ========================================================================
   PROLOGUE
   ======================================================================== */
function renderPrologue(){
  const ep = currentEpisode;
  const wrap = document.getElementById("prologueContent");
  wrap.innerHTML = `
    <p class="lede display">${ep.prologueLede}</p>
    ${ep.prologueParagraphs.map(p=>`<p>${p}</p>`).join("")}
    <div class="cast-grid">
      ${ep.cast.map(c=>`<div class="cast-card"><div class="role">${c.role}</div><div class="name display">${c.name}</div></div>`).join("")}
    </div>

    <div class="hint-select">
      <div class="hs-label">捜査ルール</div>
      <p style="font-size:13px; color:var(--ink-dim); margin:0 0 14px;">
        今回、現場や関係者を調べられる回数には上限があります。手がかりは全部で<strong style="color:var(--paper);">${ep.clues.length}件</strong>ありますが、確認できるのは<strong style="color:var(--gold);">${ep.investigationBudget}回まで</strong>。どこを重点的に調べるか、天才探偵自身の判断が問われます。
      </p>
      <div class="hs-label">捜査モードを選ぶ</div>
      <label class="hint-option ${hintLevel==='standard'?'active':''}" id="hintOptStandard">
        <input type="radio" name="hintLevel" ${hintLevel==='standard'?'checked':''}>
        <div>
          <div class="ho-title display">標準モード</div>
          <div class="ho-desc">捜査ノートに、確認した手がかりの要点が自動で記録されます。</div>
        </div>
      </label>
      <label class="hint-option ${hintLevel==='hard'?'active':''}" id="hintOptHard">
        <input type="radio" name="hintLevel" ${hintLevel==='hard'?'checked':''}>
        <div>
          <div class="ho-title display">ハードモード</div>
          <div class="ho-desc">捜査ノートには確認済みの件数だけが表示されます。証言や物証の意味は、自分の記憶と推理だけで読み解いてください。</div>
        </div>
      </label>
    </div>

    <div class="cta-row">
      <button class="btn" onclick="goPhase(1)">捜査を開始する →</button>
    </div>
  `;
  document.getElementById("hintOptStandard").onclick = ()=>{ hintLevel="standard"; renderPrologue(); };
  document.getElementById("hintOptHard").onclick = ()=>{ hintLevel="hard"; renderPrologue(); };
}

/* ========================================================================
   RENDER: LOCATION TABS + CLUES
   ======================================================================== */
function renderTabs(){
  const ep = currentEpisode;
  const wrap = document.getElementById("locTabs");
  wrap.innerHTML = "";
  ep.locations.forEach(loc=>{
    const total = ep.clues.filter(c=>c.loc===loc.id).length;
    const done = ep.clues.filter(c=>c.loc===loc.id && openedClues.has(c.id)).length;
    const el = document.createElement("div");
    el.className = "loc-tab" + (loc.id===currentLoc ? " active":"");
    el.innerHTML = `${loc.label}<span class="count">${done}/${total}</span>`;
    el.onclick = ()=>{ currentLoc = loc.id; renderTabs(); renderClues(); };
    wrap.appendChild(el);
  });
}

function renderClues(){
  const ep = currentEpisode;
  const wrap = document.getElementById("clueList");
  wrap.innerHTML = "";
  const exhausted = cluesUsed >= ep.investigationBudget;
  ep.clues.filter(c=>c.loc===currentLoc).forEach(c=>{
    const isOpen = openedClues.has(c.id);
    const isLocked = !isOpen && exhausted;
    const card = document.createElement("div");
    card.className = "clue-card" + (isLocked ? " locked-out" : "");
    card.innerHTML = `
      <div class="clue-head" onclick="toggleClue('${c.id}')">
        <div>
          <div class="clue-title display">${c.title}</div>
          <div class="clue-sub">${c.sub}</div>
        </div>
        <div class="clue-mark ${isOpen?'':'unread'}">${isOpen ? '確認済み' : (isLocked ? '捜査打ち切り' : '未確認')}</div>
      </div>
      <div class="clue-body ${isOpen?'open':''}" id="body-${c.id}">
        <div class="clue-body-inner">
          ${c.body.map((p,i)=> i>=1 && (c.body.length>1) ? `<div class="quote">${p}</div>` : `<p>${p}</p>`).join("")}
          ${hintLevel==="standard" ? c.evidence.map(e=>`<div class="evidence-tag">証拠：${e}</div>`).join(" ") : ""}
        </div>
      </div>
    `;
    wrap.appendChild(card);
  });
}

function toggleClue(id){
  const ep = currentEpisode;
  const wasOpen = openedClues.has(id);
  const bodyEl = document.getElementById("body-"+id);
  if(wasOpen){
    bodyEl.classList.remove("open");
  } else {
    if(cluesUsed >= ep.investigationBudget){
      flashBudgetWarning();
      return;
    }
    cluesUsed++;
    openedClues.add(id);
    const clue = ep.clues.find(c=>c.id===id);
    clue.evidence.forEach(e=>{
      if(!collectedEvidence.includes(e)) collectedEvidence.push(e);
    });
    bodyEl.classList.add("open");
    renderNotebook();
    renderTabs();
    renderClues(); // re-render so any now-exhausted cards lock visually
    checkDeductionUnlock();
    return;
  }
  checkDeductionUnlock();
}

function flashBudgetWarning(){
  const el = document.getElementById("nbProgress");
  if(!el) return;
  el.classList.add("budget-flash");
  setTimeout(()=> el.classList.remove("budget-flash"), 700);
}

function renderNotebook(){
  const list = document.getElementById("nbList");
  const totalClues = currentEpisode.clues.length;
  const opened = openedClues.size;

  if(hintLevel==="hard"){
    if(opened===0){
      list.innerHTML = `<div class="nb-empty">まだ何も調べていません。捜査を始めましょう。</div>`;
    } else {
      list.innerHTML = `<div class="nb-item"><span class="dot">◆</span><span>ハードモードのため、詳細は記録されません。証言や物証の内容は自分の記憶を頼りに整理してください。</span></div>`;
    }
  } else if(collectedEvidence.length===0){
    list.innerHTML = `<div class="nb-empty">まだ証拠はありません。カードを開いて調べましょう。</div>`;
  } else {
    list.innerHTML = collectedEvidence.map(e=>`<div class="nb-item"><span class="dot">◆</span><span>${e}</span></div>`).join("");
  }
  document.getElementById("nbProgress").textContent = `${opened} / ${totalClues} 件を確認（残り捜査回数 ${Math.max(0, currentEpisode.investigationBudget - cluesUsed)}）`;
}

function checkDeductionUnlock(){
  const ep = currentEpisode;
  const btn = document.getElementById("toDeductionBtn");
  const need = ep.unlockThreshold;
  btn.disabled = openedClues.size < need;
  btn.textContent = openedClues.size < need
    ? `推理へ進む → （あと${need-openedClues.size}件調べましょう）`
    : "推理へ進む →";
}

/* ========================================================================
   PHASE NAVIGATION
   ======================================================================== */
function goPhase(n){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("visible"));
  document.getElementById("screen-"+n).classList.add("visible");
  document.querySelectorAll(".phase-rail .p").forEach(p=>{
    const pn = parseInt(p.dataset.phase);
    p.classList.toggle("active", pn===n);
    p.classList.toggle("done", pn<n);
  });
  window.scrollTo({top:0, behavior:"smooth"});
  if(n===1){ renderTabs(); renderClues(); renderNotebook(); checkDeductionUnlock(); }
  if(n===2){ renderDeduction(); }
  if(n===3){ renderConfrontation(); }
}

/* ========================================================================
   DEDUCTION
   ======================================================================== */
function renderDeduction(){
  const ep = currentEpisode;
  const wrap = document.getElementById("deductionContent");
  wrap.innerHTML = `
    <div class="q-block">
      <div class="q-num">QUESTION 1</div>
      <div class="q-text display">犯人は誰か。</div>
      <p style="font-size:12.5px; color:var(--ink-faint); margin:-8px 0 16px;">当てはまる人物を選んでください。単独犯なら1人、共犯なら複数人を選択できます。</p>
      <div id="q1opts"></div>
    </div>
    <div class="q-block">
      <div class="q-num">QUESTION 2</div>
      <div class="q-text display">凶器・実行方法として最も正しいものは？</div>
      <div id="q2opts"></div>
    </div>
    <div class="q-block">
      <div class="q-num">QUESTION 3</div>
      <div class="q-text display">動機は何だったか。</div>
      <div id="q3opts"></div>
    </div>
    <div class="cta-row">
      <button class="btn" id="submitBtn" onclick="submitDeduction()" disabled>推理を披露する →</button>
    </div>
    <div class="stepper-row" style="justify-content:center;margin-top:16px;">
      <button class="btn ghost" onclick="goPhase(1)">← 捜査に戻る</button>
    </div>
  `;
  shuffledQ = {
    q2: shuffleArr(ep.questions.q2),
    q3: shuffleArr(ep.questions.q3),
  };
  shuffledSuspects = shuffleArr(ep.cast);
  renderSuspectOpts("q1opts", shuffledSuspects);
  renderOpts("q2opts", shuffledQ.q2, "q2");
  renderOpts("q3opts", shuffledQ.q3, "q3");
}
let shuffledQ = { q2:[], q3:[] };
let shuffledSuspects = [];
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function renderSuspectOpts(elId, suspects){
  const wrap = document.getElementById(elId);
  wrap.innerHTML = "";
  suspects.forEach(s=>{
    const isChecked = selected.q1.includes(s.id);
    const row = document.createElement("label");
    row.className = "opt" + (isChecked ? " selected":"");
    row.innerHTML = `<input type="checkbox" ${isChecked?'checked':''}/><span class="opt-label"><strong>${s.name}</strong>（${s.role}）</span>`;
    row.onclick = (e)=>{
      e.preventDefault();
      if(isChecked){
        selected.q1 = selected.q1.filter(id=>id!==s.id);
      } else {
        selected.q1 = [...selected.q1, s.id];
      }
      renderSuspectOpts(elId, suspects);
      checkSubmit();
    };
    wrap.appendChild(row);
  });
}
function renderOpts(elId, options, qkey){
  const wrap = document.getElementById(elId);
  wrap.innerHTML = "";
  options.forEach(o=>{
    const row = document.createElement("label");
    row.className = "opt" + (selected[qkey]===o.id ? " selected":"");
    row.innerHTML = `<input type="radio" name="${qkey}" ${selected[qkey]===o.id?'checked':''}/><span class="opt-label">${o.label}</span>`;
    row.onclick = ()=>{ selected[qkey]=o.id; renderOpts(elId, shuffledQ[qkey], qkey); checkSubmit(); };
    wrap.appendChild(row);
  });
}
function checkSubmit(){
  const btn = document.getElementById("submitBtn");
  if(btn) btn.disabled = !(selected.q1.length>0 && selected.q2 && selected.q3);
}

function arraysMatchAsSets(a,b){
  if(a.length!==b.length) return false;
  const sa = new Set(a);
  return b.every(x=>sa.has(x));
}

function submitDeduction(){
  const ep = currentEpisode;
  const q1Correct = arraysMatchAsSets(selected.q1, ep.correct.q1);
  const correct = q1Correct && selected.q2===ep.correct.q2 && selected.q3===ep.correct.q3;
  const correctCount = [q1Correct, selected.q2===ep.correct.q2, selected.q3===ep.correct.q3].filter(Boolean).length;
  pendingCorrectCount = correctCount;

  if(correct && ep.confrontation){
    // Correct deduction unlocks the face-to-face confrontation challenge.
    confrontRound = 0;
    confrontStage = "question";
    confrontLog = [];
    goPhase(3);
    return;
  }

  if(correct) clearedEpisodes.add(ep.id);
  renderResult(correct, correctCount);
  goPhase(4);
}
let pendingCorrectCount = 0;

/* ========================================================================
   CONFRONTATION MINI-GAME
   ------------------------------------------------------------------------
   Shown only when a solved episode defines ep.confrontation. The culprit
   pushes back once per round; the player must pick the one piece of
   evidence from a shuffled set that actually counters that specific
   pushback. Wrong pick -> the culprit talks their way out (game over,
   retry available). Right pick through every round -> full confession.
   ======================================================================== */
let shuffledConfrontOpts = [];

function renderConfrontation(){
  const ep = currentEpisode;
  const conf = ep.confrontation;
  const wrap = document.getElementById("confrontContent");

  const logHtml = confrontLog.map(entry => `
    <div class="confront-entry">
      <div class="confront-bubble culprit"><span class="cb-name">${conf.culpritName}</span>${entry.rebuttal}</div>
      <div class="confront-bubble detective"><span class="cb-name">天才探偵</span>${entry.chosenLabel}</div>
    </div>
  `).join("");

  if(confrontStage === "gameover"){
    wrap.innerHTML = `
      <div class="confront-intro">${logHtml}</div>
      <div class="confront-gameover">
        <div class="go-title display">TAKEN IN — 取り逃がした</div>
        <p>${conf.gameOverText}</p>
        <div class="cta-row" style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
          <button class="btn" onclick="retryConfrontation()">この場面をやり直す</button>
          <button class="btn ghost" onclick="goPhase(1)">捜査に戻る</button>
        </div>
      </div>
    `;
    return;
  }

  if(confrontStage === "confession"){
    wrap.innerHTML = `
      <div class="confront-intro">${logHtml}</div>
      <div class="confront-confession">
        <div class="cf-title display">陥落 —— 観念する</div>
        ${conf.finalConfession.map(p=>`<p>${p}</p>`).join("")}
        <div class="cta-row">
          <button class="btn" onclick="finishConfrontation()">解決編を見る →</button>
        </div>
      </div>
    `;
    return;
  }

  const round = conf.rounds[confrontRound];

  if(confrontStage === "hit"){
    wrap.innerHTML = `
      <div class="confront-intro">${logHtml}</div>
      <div class="confront-entry">
        <div class="confront-bubble culprit"><span class="cb-name">${conf.culpritName}</span>${round.rebuttal}</div>
        <div class="confront-bubble detective"><span class="cb-name">天才探偵</span>${round.correctLabel}</div>
      </div>
      <div class="confront-hit">
        <p>${round.hit}</p>
        <div class="cta-row">
          <button class="btn" onclick="advanceConfrontation()">${confrontRound+1>=conf.rounds.length ? '決着をつける →' : '反論を続ける →'}</button>
        </div>
      </div>
    `;
    return;
  }

  // stage === "question"
  if(confrontRound===0 && confrontLog.length===0){
    wrap.innerHTML = `<div class="confront-intro"><p class="confront-setup">${conf.intro}</p></div>`;
  } else {
    wrap.innerHTML = `<div class="confront-intro">${logHtml}</div>`;
  }

  shuffledConfrontOpts = shuffleArr(round.options);
  const optsHtml = shuffledConfrontOpts.map((o,i)=>`
    <div class="eopt" onclick="chooseEvidence(${i})">
      <div class="eopt-label">${o.label}</div>
    </div>
  `).join("");

  wrap.innerHTML += `
    <div class="confront-round">
      <div class="confront-round-num">対決 ${confrontRound+1} / ${conf.rounds.length}</div>
      <div class="confront-bubble culprit"><span class="cb-name">${conf.culpritName}</span>${round.rebuttal}</div>
      <div class="confront-prompt">どの証拠を突きつけますか？</div>
      <div class="eopt-grid">${optsHtml}</div>
    </div>
  `;
}

function chooseEvidence(i){
  const ep = currentEpisode;
  const conf = ep.confrontation;
  const round = conf.rounds[confrontRound];
  const opt = shuffledConfrontOpts[i];

  if(opt.correct){
    confrontLog.push({ rebuttal: round.rebuttal, chosenLabel: opt.label });
    round.correctLabel = opt.label;
    confrontStage = "hit";
  } else {
    confrontStage = "gameover";
  }
  renderConfrontation();
}

function advanceConfrontation(){
  const ep = currentEpisode;
  const conf = ep.confrontation;
  confrontRound++;
  if(confrontRound >= conf.rounds.length){
    confrontStage = "confession";
  } else {
    confrontStage = "question";
  }
  renderConfrontation();
}

function retryConfrontation(){
  confrontRound = 0;
  confrontStage = "question";
  confrontLog = [];
  renderConfrontation();
}

function finishConfrontation(){
  const ep = currentEpisode;
  clearedEpisodes.add(ep.id);
  renderResult(true, pendingCorrectCount);
  goPhase(4);
}

/* ========================================================================
   RESULT / SOLUTION
   ======================================================================== */
function renderResult(correct, correctCount){
  const ep = currentEpisode;
  const banner = document.getElementById("resultBanner");
  const body = document.getElementById("resultBody");

  if(correct){
    banner.className = "result-banner correct";
    banner.innerHTML = `
      <div class="verdict display">推理的中 —— 事件解決</div>
      <div class="sub">3問すべて正解。あなたは真相にたどり着いた。</div>
    `;
  } else {
    banner.className = "result-banner wrong";
    banner.innerHTML = `
      <div class="verdict display">推理再考の余地あり</div>
      <div class="sub">${correctCount} / 3 問正解。証拠を見直し、もう一度挑戦することもできます。</div>
    `;
  }

  const sections = ep.solutionSections.map((s,i)=>`
    <div class="solution-section">
      <h2 class="display"><span class="num">${s.title.split("　")[0]}</span>${s.title.split("　")[1]||""}</h2>
      <p>${s.html}</p>
    </div>
  `).join("");

  const evidenceRows = ep.evidenceTable.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");

  const epChars = ep.epilogue.characters.map(c=>`
    <div class="char"><div class="who">${c.who}</div><p>${c.text}</p></div>
  `).join("");

  const altP = ep.altRoute ? ep.altRoute.paragraphs.map(p=>`<p>${p}</p>`).join("") : "";

  body.innerHTML = `
    ${sections}
    <div class="solution-section">
      <h2 class="display"><span class="num">証拠</span>一覧（時系列）</h2>
      <table class="evidence-table">
        <tr><th>#</th><th>証拠</th><th>意味</th></tr>
        ${evidenceRows}
      </table>
    </div>
    ${ep.redHerrings && ep.redHerrings.length ? `
    <div class="solution-section">
      <h2 class="display"><span class="num">補足</span>ミスリードだった手がかり</h2>
      <p style="margin-bottom:10px;">捜査中に見つかった、事件とは直接関係のなかった手がかりです。</p>
      ${ep.redHerrings.map(r=>`<p>・${r}</p>`).join("")}
    </div>` : ""}
    <div class="solution-section epilogue-block">
      <h2 class="display"><span class="num">終章</span>エピローグ</h2>
      <p>${ep.epilogue.intro}</p>
      ${epChars}
      <p style="margin-top:20px;">${ep.epilogue.outro}</p>
    </div>
    ${ep.altRoute ? `
    <div class="toggle-alt">
      <button class="btn ghost" onclick="toggleAlt()">もうひとつの可能性を読む（IFルート）</button>
    </div>
    <div class="alt-route" id="altRoute">
      <h2 class="display">${ep.altRoute.title}</h2>
      ${altP}
      <p style="color:var(--ink-dim); font-size:13px; margin-top:18px;">${ep.altRoute.note}</p>
    </div>` : ""}
    <div class="cta-row" style="margin-top:36px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
      <button class="btn ghost" onclick="loadEpisode(currentEpisode)">この事件を遊び直す</button>
      <button class="btn" onclick="goSelect()">事件一覧に戻る</button>
    </div>
  `;
}

function toggleAlt(){
  document.getElementById("altRoute").classList.toggle("visible");
}

/* init */
renderCaseGrid();

/* ========================================================================
   PWA: service worker + install prompt
   ======================================================================== */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* offline caching is optional */ });
  });
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(installBtn) installBtn.style.display = "inline-block";
});

if(installBtn){
  installBtn.addEventListener("click", async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = "none";
  });
}

window.addEventListener("appinstalled", ()=>{
  if(installBtn) installBtn.style.display = "none";
});
</script>
</body>
</html>
